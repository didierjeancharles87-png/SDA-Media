<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SABATA HARIVA — Fiangonana Advantista Ambolokandrina</title>
<meta name="theme-color" content="#03050f">
<style>
  /* ═══════════════════════════════════════════════
     LIQUID GLASS TOKENS
     ═══════════════════════════════════════════════ */
  :root{
    --bg-0:#03050f; --bg-1:#0a1235; --bg-2:#141d4a; --bg-3:#060914;
    --glass-fill: rgba(255,255,255,0.12);
    --glass-fill-soft: rgba(255,255,255,0.045);
    --glass-border: rgba(255,255,255,0.30);
    --text-1: rgba(255,255,255,0.98);
    --text-2: rgba(208,219,255,0.62);
    --text-3: rgba(208,219,255,0.20);
    --accent: #5E9CFF;
    --accent-soft: rgba(94,156,255,0.45);
    --radius-card: 38px;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  body.part-b{
    --accent:#B98CFF;
    --accent-soft: rgba(185,140,255,0.45);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    background:#0A0F1E;
  }
  button{font-family:inherit;}

  /* ═══════════ BACKGROUND ═══════════ */
  .bg-canvas{
    position:fixed; inset:-40px; z-index:0; will-change:transform;
    background:
      radial-gradient(ellipse 60% 42% at 50% -6%, rgba(140,175,255,0.30) 0%, transparent 60%),
      radial-gradient(ellipse 65% 55% at 10% 102%, rgba(70,95,210,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 55% 55% at 96% 96%, var(--accent-soft) 0%, transparent 62%),
      linear-gradient(160deg, var(--bg-3) 0%, var(--bg-1) 38%, var(--bg-2) 68%, var(--bg-0) 100%);
    transition: background 1.1s ease, transform .8s cubic-bezier(.2,.8,.2,1);
    animation: drift 16s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{filter:brightness(1) saturate(1);}
    50%{filter:brightness(1.07) saturate(1.12);}
    100%{filter:brightness(0.95) saturate(0.96);}
  }
  .bg-floor{
    position:fixed; left:0; right:0; bottom:0; height:30%; z-index:0;
    background:linear-gradient(180deg, transparent, rgba(0,4,20,0.55));
    pointer-events:none;
  }

  /* ═══════════ TOP PROGRESS BAR ═══════════ */
  .progress-rail{
    position:fixed; top:0; left:0; right:0; height:3px; z-index:50;
    background:rgba(255,255,255,0.08);
  }
  .progress-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--accent), #fff);
    box-shadow:0 0 12px var(--accent-soft);
    transition:width .45s cubic-bezier(.4,0,.2,1), background 1s ease;
  }

  /* ═══════════ TOP CHROME ═══════════ */
  .chrome{
    position:fixed; top:18px; left:18px; right:18px; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
  }
  .chip{
    display:flex; align-items:center; gap:9px;
    padding:9px 16px; border-radius:999px;
    background:linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    border:1px solid var(--glass-border);
    backdrop-filter:blur(28px) saturate(170%);
    -webkit-backdrop-filter:blur(28px) saturate(170%);
    box-shadow:0 8px 24px rgba(0,4,20,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    color:var(--text-2); font-size:12.5px; font-weight:600;
    letter-spacing:.06em; white-space:nowrap;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px var(--accent-soft); flex-shrink:0; transition:background 1s ease;}
  .chip-church{cursor:default;}
  .chip-church b{color:var(--text-1); font-weight:700; letter-spacing:.04em;}
  .chip-right{display:flex; gap:10px;}
  .icon-btn{
    width:38px; height:38px; border-radius:14px; cursor:pointer;
    background:linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    border:1px solid var(--glass-border);
    backdrop-filter:blur(28px) saturate(170%);
    -webkit-backdrop-filter:blur(28px) saturate(170%);
    box-shadow:0 8px 24px rgba(0,4,20,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-1); transition:transform .15s ease, background .25s ease;
  }
  .icon-btn:hover{background:linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0.07));}
  .icon-btn:active{transform:scale(0.92);}
  .icon-btn svg{width:17px;height:17px;}
  .counter{
    padding:9px 16px; border-radius:999px;
    background:linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    border:1px solid var(--glass-border);
    backdrop-filter:blur(28px) saturate(170%);
    -webkit-backdrop-filter:blur(28px) saturate(170%);
    box-shadow:0 8px 24px rgba(0,4,20,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    font-size:13px; font-weight:700; color:var(--text-1); letter-spacing:.04em;
    font-variant-numeric:tabular-nums;
  }
  .counter span{color:var(--text-2); font-weight:600;}

  /* ═══════════ STAGE / SLIDESHOW ═══════════ */
  .stage{
    position:relative; z-index:10;
    height:100%; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding:90px 110px;
    cursor:pointer;
  }
  .click-zone{position:absolute; inset:0; z-index:1;}
  .click-zone.left{right:62%;}
  .click-zone.right{left:38%;}

  .glass-card{
    position:relative; z-index:2;
    width:min(980px, 100%);
    min-height:min(520px, 78vh);
    border-radius:var(--radius-card);
    background:linear-gradient(160deg, rgba(255,255,255,0.17) 0%, rgba(255,255,255,0.045) 52%, rgba(255,255,255,0.10) 100%);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(46px) saturate(180%);
    -webkit-backdrop-filter:blur(46px) saturate(180%);
    box-shadow:
      0 40px 90px rgba(0,4,30,0.55),
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -40px 70px rgba(140,170,255,0.05);
    overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
    padding:64px 72px;
    transition:box-shadow .6s ease;
  }
  .glass-card::before{
    content:''; position:absolute; top:-58%; left:-4%; width:62%; height:88%;
    background:radial-gradient(circle, rgba(255,255,255,0.42) 0%, transparent 65%);
    filter:blur(10px); opacity:.55; pointer-events:none;
  }
  .glass-card::after{
    content:''; position:absolute; top:0; left:8%; right:8%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
  }

  .ghost-num{
    position:absolute; top:0; right:3%; z-index:0;
    width:clamp(140px, 20vw, 320px); height:auto;
    user-select:none; pointer-events:none;
  }
  .ghost-num img{width:100%;height:auto;display:block;opacity:.35;border-radius:0 0 35px 35px;}

  .stage-bg-img{
    position:absolute; top:0; right:0; bottom:0; z-index:5;
    width:clamp(110px, 16vw, 260px);
    pointer-events:none; user-select:none; overflow:hidden;
  }
  .stage-bg-img img{
    display:block; width:100%; height:100%; object-fit:cover;
    opacity:.85;
  }

  .eyebrow{
    position:relative; z-index:2;
    display:inline-flex; align-items:center; gap:10px;
    font-size:14px; font-weight:700; letter-spacing:.16em;
    color:var(--accent); text-transform:uppercase;
    margin-bottom:22px; transition:color 1s ease;
  }
  .eyebrow::before{
    content:''; width:22px; height:2px; border-radius:2px;
    background:var(--accent); transition:background 1s ease;
  }

  .headline{
    position:relative; z-index:2;
    font-family:var(--font-display); font-weight:800;
    text-transform:uppercase;
    color:var(--text-1); letter-spacing:-0.01em;
    line-height:1.04; text-shadow:0 2px 28px rgba(130,165,255,0.30);
    margin:0; max-width:88%;
  }
  .headline.len-s{font-size:clamp(56px, 8.5vw, 118px);}
  .headline.len-m{font-size:clamp(40px, 6.4vw, 80px);}
  .headline.len-l{font-size:clamp(30px, 4.6vw, 56px);}
  .headline.len-xl{font-size:clamp(24px, 3.6vw, 42px); max-width:96%;}

  .sub{
    position:relative; z-index:2;
    font-family:var(--font-text); font-weight:500; text-transform:uppercase;
    color:var(--text-2); letter-spacing:.08em; margin-top:18px;
    font-size:clamp(14px, 1.6vw, 19px);
  }

  .glass-card.is-cover, .glass-card.is-section, .glass-card.is-end{
    align-items:flex-start; text-align:left;
  }
  .glass-card.is-cover .kicker, .glass-card.is-end .kicker{
    position:relative; z-index:2;
    font-size:13px; font-weight:700; letter-spacing:.22em;
    color:var(--text-2); text-transform:uppercase; margin-bottom:16px;
  }
  .cover-title{
    position:relative; z-index:2;
    font-family:var(--font-display); font-weight:800; text-transform:uppercase;
    color:var(--text-1); font-size:clamp(54px, 9vw, 128px); line-height:0.98;
    letter-spacing:-0.02em; margin:0; text-shadow:0 2px 30px rgba(130,165,255,0.32);
  }
  .cover-sub{
    position:relative; z-index:2; margin-top:22px;
    font-size:clamp(16px,2vw,22px); color:var(--text-2); font-weight:500;
  }
  .cover-line{
    position:relative; z-index:2; margin-top:38px;
    width:64px; height:3px; border-radius:3px;
    background:linear-gradient(90deg, var(--accent), transparent);
  }

  .part-pill-row{
    position:relative; z-index:2; display:flex; gap:14px; margin-top:34px;
  }
  .part-pill{
    padding:8px 18px; border-radius:999px; font-size:12.5px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase;
    border:1px solid rgba(255,255,255,0.22); color:var(--text-2);
    background:rgba(255,255,255,0.05);
  }
  .part-pill.active-a{color:#fff; border-color:rgba(94,156,255,0.6); background:rgba(94,156,255,0.16);}
  .part-pill.active-b{color:#fff; border-color:rgba(185,140,255,0.6); background:rgba(185,140,255,0.16);}

  /* ═══════════ NAV ARROWS ═══════════ */
  .nav-btn{
    position:fixed; top:50%; transform:translateY(-50%); z-index:30;
    width:54px; height:54px; border-radius:18px; cursor:pointer;
    background:linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    border:1px solid var(--glass-border);
    backdrop-filter:blur(28px) saturate(170%);
    -webkit-backdrop-filter:blur(28px) saturate(170%);
    box-shadow:0 10px 28px rgba(0,4,20,0.4), inset 0 1px 0 rgba(255,255,255,0.32);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-1); transition:transform .15s ease, opacity .25s ease, background .25s ease;
  }
  .nav-btn:hover{background:linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0.07));}
  .nav-btn:active{transform:translateY(-50%) scale(0.92);}
  .nav-btn:disabled{opacity:.25; cursor:default;}
  .nav-btn.prev{left:24px;} .nav-btn.next{right:24px;}
  .nav-btn svg{width:20px;height:20px;}

  /* ═══════════ BOTTOM PROGRESS ═══════════ */
  .bottom-track{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:30;
    display:flex; gap:10px; align-items:center;
  }
  .track-pill{
    width:120px; height:8px; border-radius:999px; overflow:hidden;
    background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.18);
    position:relative;
  }
  .track-pill-fill{
    position:absolute; left:0; top:0; height:100%; width:0%;
    background:linear-gradient(90deg,#5E9CFF,#8AB8FF);
    transition:width .4s ease;
  }
  .track-pill.b .track-pill-fill{background:linear-gradient(90deg,#B98CFF,#D6B8FF);}
  .track-pill.dim{opacity:.35;}

  /* ═══════════ MENU OVERLAY ═══════════ */
  .menu-overlay{
    position:fixed; inset:0; z-index:60;
    background:rgba(3,5,15,0.55);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    padding:40px;
  }
  .menu-overlay.open{opacity:1; pointer-events:auto;}
  .menu-panel{
    width:min(720px,100%); max-height:82vh; overflow-y:auto;
    border-radius:32px;
    background:linear-gradient(165deg, rgba(20,26,58,0.92), rgba(8,11,28,0.96));
    border:1px solid rgba(255,255,255,0.20);
    backdrop-filter:blur(40px) saturate(170%);
    -webkit-backdrop-filter:blur(40px) saturate(170%);
    box-shadow:0 40px 100px rgba(0,4,30,0.6);
    padding:30px;
    transform:translateY(14px) scale(.98); transition:transform .25s ease;
  }
  .menu-overlay.open .menu-panel{transform:translateY(0) scale(1);}
  .menu-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .menu-head h3{margin:0; font-family:var(--font-display); color:var(--text-1);
    font-size:18px; letter-spacing:.04em; text-transform:uppercase; font-weight:800;}
  .menu-group-label{
    font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-2); margin:22px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .menu-group-label::before{content:'';width:16px;height:2px;border-radius:2px;background:var(--text-2);}
  .menu-group-label.a{color:#9CC2FF;} .menu-group-label.a::before{background:#5E9CFF;}
  .menu-group-label.b{color:#D2B8FF;} .menu-group-label.b::before{background:#B98CFF;}
  .menu-list{display:flex; flex-direction:column; gap:6px;}
  .menu-item{
    display:flex; align-items:center; gap:12px;
    padding:11px 14px; border-radius:14px; cursor:pointer;
    border:1px solid transparent; color:var(--text-2);
    font-size:14px; font-weight:600; letter-spacing:.02em; text-transform:uppercase;
    transition:background .15s ease, color .15s ease;
  }
  .menu-item:hover{background:rgba(255,255,255,0.08); color:var(--text-1);}
  .menu-item.current{background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.25); color:#fff;}
  .menu-item .idx{
    width:26px; height:26px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; background:rgba(255,255,255,0.10); color:var(--text-2);
  }

  /* ═══════════ HINT ═══════════ */
  .hint{
    position:fixed; bottom:60px; left:50%; transform:translateX(-50%); z-index:25;
    font-size:12.5px; color:var(--text-2); letter-spacing:.04em;
    opacity:0; transition:opacity .6s ease .4s; pointer-events:none;
    display:flex; gap:18px; white-space:nowrap;
  }
  .hint.show{opacity:1;}
  .hint kbd{
    border:1px solid rgba(255,255,255,0.25); border-radius:6px; padding:1px 7px;
    font-family:inherit; font-size:11px; margin-right:5px; color:var(--text-1);
  }

  /* ═══════════ SLIDE TRANSITIONS ═══════════ */
  @keyframes fadeOut{to{opacity:0}}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes pushOutLeft{to{transform:translateX(-80px);opacity:0}}
  @keyframes pushOutRight{to{transform:translateX(80px);opacity:0}}
  @keyframes pushInRight{from{transform:translateX(80px);opacity:0}}
  @keyframes pushInLeft{from{transform:translateX(-80px);opacity:0}}
  @keyframes zoomOut{to{transform:scale(0.8);opacity:0}}
  @keyframes zoomIn{from{transform:scale(0.8);opacity:0}}
  @keyframes slideOutLeft{to{transform:translateX(-140px);opacity:0}}
  @keyframes slideOutRight{to{transform:translateX(140px);opacity:0}}
  @keyframes slideInRight{from{transform:translateX(140px);opacity:0}}
  @keyframes slideInLeft{from{transform:translateX(-140px);opacity:0}}
  @keyframes curtainOutLeft{to{clip-path:polygon(0 0,0 0,0 100%,0 100%);opacity:0}}
  @keyframes curtainOutRight{to{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%);opacity:0}}
  @keyframes curtainInRight{from{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%);opacity:0}}
  @keyframes curtainInLeft{from{clip-path:polygon(0 0,0 0,0 100%,0 100%);opacity:0}}
  @keyframes flipOutLeft{to{transform:perspective(800px) rotateY(18deg);opacity:0}}
  @keyframes flipOutRight{to{transform:perspective(800px) rotateY(-18deg);opacity:0}}
  @keyframes flipInRight{from{transform:perspective(800px) rotateY(-18deg);opacity:0}}
  @keyframes flipInLeft{from{transform:perspective(800px) rotateY(18deg);opacity:0}}
  @keyframes bounceOutLeft{to{transform:translateX(-100px);opacity:0;animation-timing-function:cubic-bezier(.6,.04,.98,.34)}}
  @keyframes bounceOutRight{to{transform:translateX(100px);opacity:0;animation-timing-function:cubic-bezier(.6,.04,.98,.34)}}
  @keyframes bounceInRight{0%{transform:translateX(100px);opacity:0;animation-timing-function:cubic-bezier(.36,.07,.19,.97)}60%{transform:translateX(-12px);opacity:1}80%{transform:translateX(4px)}100%{transform:translateX(0);opacity:1}}
  @keyframes bounceInLeft{0%{transform:translateX(-100px);opacity:0;animation-timing-function:cubic-bezier(.36,.07,.19,.97)}60%{transform:translateX(12px);opacity:1}80%{transform:translateX(-4px)}100%{transform:translateX(0);opacity:1}}
  @media (prefers-reduced-motion: reduce){
    .bg-canvas{animation:none;}
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  /* ═══════════ WORD REVEAL ═══════════ */
  .headline .word{display:inline-block;opacity:0;animation:wordReveal .4s cubic-bezier(.2,.8,.2,1) forwards}
  .headline .word:nth-child(1){animation-delay:.35s}
  @keyframes wordReveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  @media (prefers-reduced-motion: reduce){
    .headline .word{animation:none!important;opacity:1!important}
  }

  /* ═══════════ CONFETTI ═══════════ */
  @keyframes confettiFall{
    0%{opacity:0;transform:translateY(-10px) rotate(0deg) scale(1)}
    8%{opacity:1}
    100%{opacity:0;transform:translateY(100vh) rotate(720deg) scale(0.4)}
  }

  /* ═══════════ AMBIENT PARTICLES ═══════════ */
  .particle{
    position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:rgba(255,255,255,0.08);
    animation:particleFloat linear infinite;
  }
  @keyframes particleFloat{
    0%{transform:translateY(100vh) translateX(0) scale(0);opacity:0}
    5%{opacity:1}
    95%{opacity:1}
    100%{transform:translateY(-5vh) translateX(30px) scale(1);opacity:0}
  }

  /* ═══════════ AUTO-PLAY PULSE ═══════════ */
  #autoPlayBtn.is-playing svg{filter:drop-shadow(0 0 6px var(--accent))}
  #autoPlayBtn.is-playing{animation:btnPulse 2s ease-in-out infinite}
  @keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(94,156,255,0.3)}50%{box-shadow:0 0 0 6px rgba(94,156,255,0)}}

  /* ═══════════ LIVE CLOCK ═══════════ */
  #liveClock{font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}

  /* ═══════════════════════════════════════════════
     TIMER MODAL (card selector)
     ═══════════════════════════════════════════════ */
  .timer-modal-overlay{
    position:fixed; inset:0; z-index:70;
    background:rgba(3,5,15,0.65);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
    padding:24px;
  }
  .timer-modal-overlay.open{opacity:1; pointer-events:auto;}
  .timer-modal-panel{
    width:min(460px,100%);
    position:relative;
    border-radius:32px;
    padding:36px 32px;
    background:linear-gradient(165deg, rgba(20,26,58,0.96), rgba(8,11,28,0.98));
    border:1px solid rgba(255,255,255,0.20);
    backdrop-filter:blur(40px) saturate(170%);
    -webkit-backdrop-filter:blur(40px) saturate(170%);
    box-shadow:0 40px 100px rgba(0,4,30,0.6);
    transform:translateY(14px) scale(.98);
    transition:transform .3s ease;
  }
  .timer-modal-overlay.open .timer-modal-panel{
    transform:translateY(0) scale(1);
  }
  .timer-modal-panel .modal-close{
    position:absolute; top:16px; right:16px; z-index:5;
  }
  .timer-modal-panel h1{
    font-family:var(--font-display); font-size:26px; font-weight:800;
    text-align:center; color:var(--text-1); margin-bottom:4px;
  }
  .timer-modal-panel .timer-sub{
    font-size:14px; font-weight:600; color:var(--text-2);
    text-align:center; letter-spacing:1px; margin-bottom:24px;
  }
  .sel-wrap{position:relative;margin-bottom:16px}
  .sel-wrap label{

<script>
/* ===================== TIMER FUNCTIONS ===================== */
var _timerInterval=null,_remaining=0,_total=0,_isPlaying=false;

function startDisplay(){
  closeTimerModal();
  var sel=document.getElementById('sampanaSelect');
  var name=sel.value;
  if(!name){sel.focus();return}
  var mins=parseInt(document.getElementById('minSelect').value)||0;
  var secs=parseInt(document.getElementById('secSelect').value)||0;
  _total=mins*60+secs;
  if(_total<1)_total=60;
  _remaining=_total;
  _isPlaying=false;
  if(_timerInterval){clearInterval(_timerInterval);_timerInterval=null}
  document.getElementById('dispName').textContent=name;
  updateDispTimer();
  document.getElementById('dispPlayBtn').innerHTML='&#x25B6;';
  document.getElementById('display').classList.add('open');
  try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen()}catch(e){}
}

function updateDispTimer(){
  var m=Math.floor(_remaining/60),s=_remaining%60;
  document.getElementById('dispTimer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function toggleTimer(){
  if(_timerInterval){
    clearInterval(_timerInterval);_timerInterval=null;
    _isPlaying=false;document.getElementById('dispPlayBtn').innerHTML='&#x25B6;';
    return
  }
  if(_remaining<=0){_remaining=_total;updateDispTimer()}
  _isPlaying=true;document.getElementById('dispPlayBtn').innerHTML='&#x23F8;';
  _timerInterval=setInterval(function(){
    _remaining--;
    if(_remaining<=0){
      clearInterval(_timerInterval);_timerInterval=null;
      _isPlaying=false;document.getElementById('dispPlayBtn').innerHTML='&#x25B6;';
      _remaining=0;
    }
    updateDispTimer();
  },1000);
}

function resetTimer(){
  if(_timerInterval){clearInterval(_timerInterval);_timerInterval=null}
  _isPlaying=false;_remaining=_total;
  document.getElementById('dispPlayBtn').innerHTML='&#x25B6;';
  updateDispTimer();
}

function closeDisplay(){

}

/* ===================== SLIDESHOW ===================== */
(function(){
  "use strict";

  var SLIDES = [
    {type:"cover"},
    {type:"section", part:"A", title:"Fiangonana miofana", sub:"Sabata hariva"},
    {type:"item", part:"A", text:"Vakiteny salamo"},
    {type:"item", part:"A", text:"Hira fiderana"},
    {type:"item", part:"A", text:"Vavaka"},
    {type:"item", part:"A", text:"Fiarahabana sy fanentanana"},
    {type:"item", part:"A", text:"Hira"},
    {type:"item", part:"A", text:"Hira na fotoana voarindra 2"},
    {type:"item", part:"A", text:"Fitsipika mifehy ny Fiangonana"},
    {type:"item", part:"A", text:"Hira na fotoana voarindra 2"},
    {type:"item", part:"A", text:"FIPIKRI"},
    {type:"item", part:"A", text:"Hira na fotoana voarindra 1"},
    {type:"item", part:"A", text:"Fanabeazana"},
    {type:"item", part:"A", text:"Fotoana voarindra 1"},
    {type:"item", part:"A", text:"Sampana"},
    {type:"item", part:"A", text:"Fandalinana foto-pinoana"},
    {type:"item", part:"A", text:"Sampana"},
    {type:"item", part:"A", text:"Fotoana voarindra"},
    {type:"item", part:"A", text:"Sampana"},
    {type:"item", part:"A", text:"Fotoana voarindra"},
    {type:"item", part:"A", text:"Sampana"},
    {type:"item", part:"A", text:"Hira andininy iray"},
    {type:"item", part:"A", text:"Filazan-draharaha"},
    {type:"section", part:"B", title:"Culte hariva"},
    {type:"item", part:"B", text:"Vakiteny salamo"},
    {type:"item", part:"B", text:"Hira"},
    {type:"item", part:"B", text:"Fiaraha-mivavaka"},
    {type:"item", part:"B", text:"Hira choral"},
    {type:"item", part:"B", text:"Vatsim-panahy"},
    {type:"item", part:"B", text:"Hira & tso-drano"},
    {type:"end"}
  ];

  (function indexParts(){
    var ca=0, cb=0;
    for(var i=0;i<SLIDES.length;i++){
      var s=SLIDES[i];
      if(s.type==="item"){
        if(s.part==="A"){ca++; s.idx=ca;}
        else{cb++; s.idx=cb;}
      }
    }
  })();
  var TOTAL_A = SLIDES.filter(function(s){return s.type==="item" && s.part==="A";}).length;
  var TOTAL_B = SLIDES.filter(function(s){return s.type==="item" && s.part==="B";}).length;

  var cur = 0;
  var STORE_KEY = "sabata_hariva_slide";
  try{
    var saved = parseInt(localStorage.getItem(STORE_KEY), 10);
    if(!isNaN(saved) && saved >= 0 && saved < SLIDES.length) cur = saved;
  }catch(e){}

  var card = document.getElementById("card");
  var progressFill = document.getElementById("progressFill");
  var counterCur = document.getElementById("counterCur");
  var counterTotal = document.getElementById("counterTotal");
  var hint = document.getElementById("hint");
  var trackAFill = document.getElementById("trackAFill");
  var trackBFill = document.getElementById("trackBFill");
  var trackA = document.getElementById("trackA");
  var trackB = document.getElementById("trackB");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  counterTotal.textContent = pad(SLIDES.length);

  function pad(n){ return (n<10?"0":"")+n; }

  function lenClass(text){
    var n = text.length;
    if(n<=10) return "len-s";
    if(n<=20) return "len-m";
    if(n<=34) return "len-l";
    return "len-xl";
  }

  function render(){
    var s = SLIDES[cur];
    document.body.classList.toggle("part-b", s.part === "B" || (s.type==="end"));
    document.body.classList.toggle("part-a", !(s.part === "B" || s.type==="end"));

    var html = "";
    if(s.type === "cover"){
      card.className = "glass-card is-cover";
      html =
        '<div class="kicker">Fandaharam-potoana</div>' +
        '<h1 class="cover-title">Sabata<br>hariva</h1>' +
        '<div class="cover-sub">Fiangonana Advantista Ambolokandrina</div>' +
        '<div class="cover-line"></div>' +
        '<div class="part-pill-row">' +
          '<span class="part-pill active-a">A &middot; Fiangonana miofana</span>' +
          '<span class="part-pill">B &middot; Culte hariva</span>' +
        '</div>';
    } else if(s.type === "section"){
      card.className = "glass-card is-section";
      html =
        '<div class="ghost-num"><img src="logoslide.png" alt=""></div>' +
        '<div class="eyebrow">Fizarana ' + s.part + '</div>' +
        '<h1 class="cover-title">' + s.title + '</h1>' +
        (s.sub ? '<div class="cover-sub">' + s.sub.toUpperCase() + '</div>' : '') +
        '<div class="cover-line"></div>';
    } else if(s.type === "item"){
      card.className = "glass-card";
      var label = s.part === "A" ? "Fiangonana miofana &mdash; Sabata hariva" : "Culte hariva";
      html =
        '<div class="ghost-num"><img src="logoslide.png" alt=""></div>' +
        '<div class="eyebrow">' + label + '</div>' +
        '<h1 class="headline ' + lenClass(s.text) + '">' + s.text.split(' ').map(function(w,i){return '<span class="word" style="animation-delay:'+(.35+i*.06)+'s">'+w+'</span>'}).join(' ') + '</h1>';
    } else {
      card.className = "glass-card is-end";
      html =
        '<div class="kicker">Famaranana</div>' +
        '<h1 class="cover-title" style="font-size:clamp(36px,6vw,72px);">Ho an&rsquo;Andriamanitra<br>irery ny voninahitra</h1>' +
        '<div class="cover-sub">Misaotra an&rsquo;Andriamanitra tamin&rsquo;ity Sabata hariva ity</div>' +
        '<div class="cover-line"></div>' +
        '';
    }
    card.innerHTML = html;

    var pct = (cur / (SLIDES.length - 1)) * 100;
    progressFill.style.width = pct + "%";
    counterCur.textContent = pad(cur + 1);

    var doneA = SLIDES.slice(0, cur + 1).filter(function(x){return x.type==="item" && x.part==="A";}).length;
    var doneB = SLIDES.slice(0, cur + 1).filter(function(x){return x.type==="item" && x.part==="B";}).length;
    trackAFill.style.width = (TOTAL_A ? (doneA / TOTAL_A) * 100 : 0) + "%";
    trackBFill.style.width = (TOTAL_B ? (doneB / TOTAL_B) * 100 : 0) + "%";
    trackA.classList.toggle("dim", s.part === "B" || s.type === "end");
    trackB.classList.toggle("dim", !(s.part === "B" || s.type === "end"));

    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === SLIDES.length - 1;
    hint.classList.toggle("show", cur === 0);

    try{ localStorage.setItem(STORE_KEY, String(cur)); }catch(e){}
    renderMenuHighlight();
    /* confetti on end slide */
    if(s.type==="end"){ if(!document.getElementById('_confetti')) startConfetti(); }
    else { stopConfetti(); }
  }

  var _animating = false;
  var _transTypes = ['fade','push','zoom','slide','curtain','flip','bounce'];
  function pickTrans(){ return _transTypes[Math.floor(Math.random()*_transTypes.length)]; }

  function goto(i, direct){
    var target = Math.max(0, Math.min(SLIDES.length - 1, i));
    if(target === cur || _animating) return;
    var dir = target > cur;
    var trans = direct ? 'fade' : pickTrans();
    _animating = true;
    card.style.animation = trans + 'Out' + (dir ? 'Left' : 'Right') + ' .42s ease forwards';
    setTimeout(function(){
      cur = target;
      render();
      card.style.animation = 'none';
      void card.offsetWidth;
      card.style.animation = trans + 'In' + (dir ? 'Right' : 'Left') + ' .42s ease forwards';
      setTimeout(function(){ card.style.animation = ''; _animating = false; }, 440);
    }, 410);
  }
  function nextSlide(){ goto(cur + 1); }
  function prevSlide(){ goto(cur - 1); }

  prevBtn.addEventListener("click", function(e){ e.stopPropagation(); prevSlide(); });
  nextBtn.addEventListener("click", function(e){ e.stopPropagation(); nextSlide(); });
  document.getElementById("zoneLeft").addEventListener("click", prevSlide);
  document.getElementById("zoneRight").addEventListener("click", nextSlide);

  /* swipe */
  var touchX = null;
  document.getElementById("stage").addEventListener("touchstart", function(e){
    touchX = e.changedTouches[0].clientX;
  }, {passive:true});
  document.getElementById("stage").addEventListener("touchend", function(e){
    if(touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 50){ dx < 0 ? nextSlide() : prevSlide(); }
    touchX = null;
  }, {passive:true});

  /* fullscreen */
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  }
  document.getElementById("fsBtn").addEventListener("click", toggleFullscreen);

  /* menu */
  var menuOverlay = document.getElementById("menuOverlay");
  var menuBody = document.getElementById("menuBody");

  function buildMenu(){
    var html = '<div class="menu-group-label a">Fizarana A &mdash; Fiangonana miofana</div><div class="menu-list">';
    SLIDES.forEach(function(s, i){
      if(s.type === "item" && s.part === "A"){
        html += menuItemHTML(s, i);
      }
    });
    html += '</div><div class="menu-group-label b">Fizarana B &mdash; Culte hariva</div><div class="menu-list">';
    SLIDES.forEach(function(s, i){
      if(s.type === "item" && s.part === "B"){
        html += menuItemHTML(s, i);
      }
    });
    html += '</div>';
    menuBody.innerHTML = html;

    Array.prototype.forEach.call(menuBody.querySelectorAll(".menu-item"), function(el){
      el.addEventListener("click", function(){
        goto(parseInt(el.getAttribute("data-i"), 10), true);
        closeMenu();
      });
    });
  }
  function menuItemHTML(s, i){
    return '<div class="menu-item' + (i === cur ? ' current' : '') + '" data-i="' + i + '">' +
      '<span class="idx">' + pad(s.idx) + '</span><span>' + s.text + '</span></div>';
  }
  function renderMenuHighlight(){
    if(menuOverlay.classList.contains("open")) buildMenu();
  }
  function openMenu(){ buildMenu(); menuOverlay.classList.add("open"); }
  function closeMenu(){ menuOverlay.classList.remove("open"); }

  document.getElementById("menuBtn").addEventListener("click", openMenu);
  document.getElementById("menuClose").addEventListener("click", closeMenu);
  menuOverlay.addEventListener("click", function(e){ if(e.target === menuOverlay) closeMenu(); });

  window.__sabataGoTo = function(i){ goto(i, true); };
  window.__sabataTotal = SLIDES.length;
  window.__sabataNext = function(){ nextSlide(); };
  render();
})();

/* ===================== KEYBOARD SHORTCUTS ===================== */
document.addEventListener('keydown', function(e){
  var display = document.getElementById('display');
  if(display.classList.contains('open')){
    if(e.key===' '||e.key==='Spacebar'){e.preventDefault();toggleTimer()}
    else if(e.key==='Escape'){e.preventDefault();closeDisplay()}
    else if(e.key==='r'||e.key==='R'){e.preventDefault();resetTimer()}
    return;
  }
  if(document.getElementById('timerModal').classList.contains('open')){
    if(e.key==='Escape'){e.preventDefault();closeTimerModal()}
    return;
  }
  if(document.getElementById('menuOverlay').classList.contains('open')){
    if(e.key==='Escape'){e.preventDefault();closeMenu()}
    return;
  }
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();document.getElementById('nextBtn').click()}
  else if(e.key==='ArrowLeft'){e.preventDefault();document.getElementById('prevBtn').click()}
  else if(e.key==='Home'){e.preventDefault();window.__sabataGoTo&&window.__sabataGoTo(0)}
  else if(e.key==='End'){e.preventDefault();window.__sabataGoTo&&window.__sabataGoTo(window.__sabataTotal-1)}
  else if(e.key==='m'||e.key==='M'){e.preventDefault();document.getElementById('menuBtn').click()}
  else if(e.key==='f'||e.key==='F'){e.preventDefault();document.getElementById('fsBtn').click()}
  else if(e.key==='t'||e.key==='T'){e.preventDefault();openTimerModal()}
  else if(e.key==='z'||e.key==='Z'){e.preventDefault();toggleZoom()}
  else if(e.key==='a'||e.key==='A'){e.preventDefault();toggleAutoPlay()}
});

/* ===================== CONFETTI ===================== */
function startConfetti(){
  if(document.getElementById('_confetti')) return;
  var cols = ['#FF6B6B','#4ECDC4','#45B7D1','#FFD93D','#A29BFE','#FD79A8','#FFA07A','#00CEC9'];
  var w = document.createElement('div');
  w.id = '_confetti';
  w.style.cssText = 'position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden';
  document.body.appendChild(w);
  for(var i=0;i<100;i++){
    var e = document.createElement('div');
    var sz = 4+Math.random()*10;
    var x = Math.random()*100;
    var d = Math.random()*6;
    var dur = 2.5+Math.random()*3.5;
    var c = cols[Math.floor(Math.random()*cols.length)];
    var r = Math.random()*360;
    var h = sz*(0.3+Math.random()*1.2);
    e.style.cssText = 'position:absolute;left:'+x+'%;top:-'+sz+'px;width:'+sz+'px;height:'+h+'px;background:'+c+';border-radius:2px;opacity:0;animation:confettiFall '+dur+'s ease-in '+d+'s infinite;transform:rotate('+r+'deg)';
    w.appendChild(e);
  }
}
function stopConfetti(){
  var w = document.getElementById('_confetti');
  if(w) w.remove();
}

/* ===================== PARALLAX 3D ===================== */
(function(){
  var bg = document.querySelector('.bg-canvas');
  if(!bg) return;
  var raf = null;
  var cx = 0, cy = 0, tx = 0, ty = 0;
  document.addEventListener('mousemove', function(e){
    cx = ((e.clientX / window.innerWidth) - 0.5) * 2;
    cy = ((e.clientY / window.innerHeight) - 0.5) * 2;
    if(!raf) raf = requestAnimationFrame(step);
  });
  function step(){
    tx += (cx * 12 - tx) * 0.06;
    ty += (cy * 12 - ty) * 0.06;
    bg.style.transform = 'translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px)';
    raf = null;
  }
})();

/* ===================== AUTO-PLAY ===================== */
var _autoActive = false;
var _autoTimer = null;
function toggleAutoPlay(){
  if(_autoActive) stopAutoPlay();
  else startAutoPlay();
  showUI();
}
function startAutoPlay(){
  if(_autoActive) return;
  _autoActive = true;
  document.getElementById('autoPlayBtn').classList.add('is-playing');
  document.getElementById('autoPlayBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
  tickAutoPlay();
}
function stopAutoPlay(){
  _autoActive = false;
  if(_autoTimer){ clearTimeout(_autoTimer); _autoTimer = null; }
  document.getElementById('autoPlayBtn').classList.remove('is-playing');
  document.getElementById('autoPlayBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>';
}
function tickAutoPlay(){
  if(!_autoActive) return;
  if(document.getElementById('nextBtn').disabled){ stopAutoPlay(); return; }
  window.__sabataNext && window.__sabataNext();
  _autoTimer = setTimeout(tickAutoPlay, 8000);
}
document.getElementById('autoPlayBtn').addEventListener('click', toggleAutoPlay);
document.getElementById('prevBtn').addEventListener('click', stopAutoPlay);
document.getElementById('nextBtn').addEventListener('click', stopAutoPlay);
var __origGoTo = window.__sabataGoTo;
window.__sabataGoTo = function(i){ stopAutoPlay(); __origGoTo(i); };
