<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Robia Hariva - Fanompoana Kristianina</title>
<meta name="theme-color" content="#0A0F1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;background:#0A0F1E;color:rgba(255,255,255,0.97);min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
.bg-canvas{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(10,132,255,.35) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 80% 80%,rgba(90,200,250,.2) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 60% 30%,rgba(52,199,89,.1) 0%,transparent 50%),linear-gradient(160deg,#0A0F1E 0%,#0D1B2A 40%,#0A1628 100%);animation:bgPulse 12s ease-in-out infinite alternate}
@keyframes bgPulse{0%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(10deg) brightness(1.05)}100%{filter:hue-rotate(-5deg) brightness(.98)}}
.slideshow{position:fixed;inset:0;z-index:2000;opacity:0;pointer-events:none;transition:opacity .5s ease}
.slideshow.open{opacity:1;pointer-events:all}
.slide{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;padding:40px 24px;pointer-events:none}
.slide.active{z-index:2;opacity:1;pointer-events:all}
.slide.exit{z-index:3;pointer-events:none}
.slide.enter-fade{animation:fadeIn .6s ease both}
.slide.exit-fade{animation:fadeOut .5s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.slide h1{font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-.5px;line-height:1.2;margin-bottom:4px;text-shadow:0 4px 24px rgba(0,0,0,.7);background:rgba(0,0,0,.2);padding:6px 20px;border-radius:16px;display:inline-block}
.slide .sub{font-size:clamp(13px,2vw,18px);font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.6);background:rgba(0,0,0,.15);padding:4px 14px;border-radius:12px;display:inline-block;margin-bottom:12px}
.slide-controls{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:20px 24px 32px;background:linear-gradient(0deg,rgba(0,0,0,.6) 0%,transparent 100%);transition:opacity .35s ease}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ctrl-btn{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.ctrl-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.06)}
.ctrl-btn:active{transform:scale(.92)}
.ctrl-btn.exit{background:rgba(255,59,48,.25)}
.ctrl-btn.exit:hover{background:rgba(255,59,48,.4)}
.ctrl-progress{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;cursor:pointer}
.ctrl-progress-fill{height:100%;background:linear-gradient(90deg,#0A84FF,#5AC8FA);border-radius:2px;transition:width .3s}
.ctrl-label{font-size:13px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:1px;white-space:nowrap;min-width:50px;text-align:center}
.slide-close{position:absolute;top:16px;left:16px;z-index:20;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;background:rgba(0,0,0,.4);backdrop-filter:blur(12px);color:rgba(255,255,255,.7);font-size:20px;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease,background .2s}
.slide-close:hover{background:rgba(255,59,48,.5);color:#fff}
.slide-hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:25;font-size:12px;font-weight:500;letter-spacing:.5px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.5);backdrop-filter:blur(12px);padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.1);white-space:nowrap;pointer-events:none;transition:opacity .6s ease,transform .6s ease}
.slide-hint.hide{opacity:0;transform:translateX(-50%) translateY(-10px)}
.fk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:820px;width:100%;margin:16px auto 0;padding:0 16px;max-height:65vh;overflow-y:auto}
.fk-grid::-webkit-scrollbar{width:4px}
.fk-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.fk-chapter-btn{padding:14px 10px;border-radius:14px;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);transition:all .25s;text-align:center;display:flex;flex-direction:column;gap:3px}
.fk-chapter-btn:hover{background:rgba(90,200,250,.12);border-color:rgba(90,200,250,.3);transform:scale(1.04)}
.fk-chapter-btn .fk-ch-num{font-size:15px;font-weight:800;color:#5AC8FA;letter-spacing:1px}
.fk-chapter-btn .fk-ch-title{font-size:10px;color:rgba(255,255,255,.5);line-height:1.3}
.fk-slide-inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:56px 20px 76px;overflow-y:auto}
.fk-top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0}
.fk-chapter-list-btn{padding:6px 14px;border-radius:10px;border:1px solid rgba(90,200,250,.25);background:rgba(90,200,250,.08);color:#5AC8FA;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.fk-chapter-list-btn:hover{background:rgba(90,200,250,.18);transform:scale(1.04)}
.fk-refcode{font-size:12px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:1px}
.fk-text{flex:1;display:flex;align-items:center;justify-content:center;line-height:1.7;color:rgba(255,255,255,.97);text-shadow:0 2px 12px rgba(0,0,0,.4);text-align:center;padding:0 6px;word-break:break-word}
.fk-section-title{font-size:clamp(22px,3.5vw,40px);font-weight:800;color:#5AC8FA;text-align:center;letter-spacing:.5px;text-shadow:0 2px 16px rgba(0,0,0,.4)}
@media(max-width:500px){.ctrl-btn{width:40px;height:40px;font-size:18px}}
@media(max-width:420px){
  .ctrl-btn{width:36px;height:36px;font-size:16px}
  .slide h1{font-size:clamp(20px,5vw,30px)}
  .fk-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .fk-chapter-btn{padding:12px 16px;font-size:15px}
  .fk-slide-inner{padding:40px 14px 60px}
}
@media(max-width:360px){
  .ctrl-btn{width:32px;height:32px;font-size:14px}
  .slide h1{font-size:clamp(17px,4.5vw,26px)}
  .fk-section-title{font-size:clamp(18px,3.5vw,28px)}
  .fk-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .fk-chapter-btn{padding:10px 12px;font-size:13px}
  .slide-close{width:36px;height:36px;font-size:16px}
  .ctrl-row{gap:8px}
}
</style>
</head>
<body>
<div class="bg-canvas" aria-hidden="true"></div>
<div id="root"></div>
<script src="fanompoana_data.js"></script>
<script>
(function(){
  var slideShowEl=null,cur=0,chapterStart=[],total=0,hideTimeout=null,fsTriggered=false;
  var root=document.getElementById('root');
  slideShowEl=document.createElement('div');slideShowEl.className='slideshow';
  slideShowEl.innerHTML='<div class="slide active" id="fkS0" style="background:linear-gradient(145deg,#0A0F1E 0%,#0D2140 50%,#0A1628 100%)"><div class="fk-slide-inner" style="align-items:center;justify-content:center;padding-top:50px"><h1 style="font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-.5px;margin-bottom:4px">Fanompoana Kristianina</h1><div class="sub" style="margin-bottom:12px">Robia Hariva</div><div class="fk-loading-text" id="fkLoadStatus">Am-pakiana ...</div></div></div>';
  root.appendChild(slideShowEl);
  requestAnimationFrame(function(){slideShowEl.classList.add('open')});
  if(window.FANOMPOANA_DATA){buildFkSlides(window.FANOMPOANA_DATA)}else{document.getElementById('fkLoadStatus').textContent='Tsy hita ny angona'}

  function tryFS(){
    if(!fsTriggered){fsTriggered=true;try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen()}catch(e){}}
  }
  document.addEventListener('keydown',tryFS,{once:true});
  document.addEventListener('mousedown',tryFS,{once:true});
  document.addEventListener('touchstart',tryFS,{once:true});

  function getFkFontSize(t){var l=t?t.length:0;if(l<200)return'clamp(28px,4.5vw,52px)';if(l<400)return'clamp(22px,3.5vw,42px)';if(l<700)return'clamp(18px,2.8vw,34px)';return'clamp(15px,2.2vw,28px)'}
  function chLabel(ch){return ch.chapter_number!==undefined?'TOKO '+ch.chapter_number:ch.title}
  function buildFkSlides(data){
    var h='',cs=[],si=1;
    h+='<div class="slide active" id="fkS0" style="background:linear-gradient(145deg,#0A0F1E 0%,#0D2140 50%,#0A1628 100%)"><div class="fk-slide-inner" style="align-items:center;justify-content:center;padding-top:50px"><h1 style="font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-.5px;margin-bottom:4px">Fanompoana Kristianina</h1><div class="sub" style="margin-bottom:12px">Robia Hariva &#x2022; Fidio ny TOKO</div><div class="fk-grid">';
    data.forEach(function(ch,i){
      var st=ch.title.replace(/^Toko \d+ - /,'');
      var isCh=ch.chapter_number!==undefined;
      var numLabel=isCh?'TOKO '+ch.chapter_number:st.toUpperCase();
      h+='<div class="fk-chapter-btn" onclick="goToFkChapter('+i+')"><span class="fk-ch-num">'+numLabel+'</span><span class="fk-ch-title">'+(isCh?st:'')+'</span></div>'
    });
    h+='</div></div></div>';
    data.forEach(function(ch,ci){
      cs.push(si);
      ch.sections.forEach(function(sec){
        if(sec.section_title){
          h+='<div class="slide" id="fkS'+si+'" style="background:linear-gradient(145deg,#0A0F1E 0%,#0D2140 50%,#0A1628 100%)"><div class="fk-slide-inner"><div class="fk-top-bar"><button class="fk-chapter-list-btn" onclick="goToFkSlide(0)">'+chLabel(ch)+'</button></div><div class="fk-text"><div class="fk-section-title">'+sec.section_title+'</div></div></div></div>';si++
        }
        sec.paragraphs.forEach(function(p){
          var fs=getFkFontSize(p.text);
          h+='<div class="slide" id="fkS'+si+'" style="background:linear-gradient(145deg,#0A0F1E 0%,#0D2140 50%,#0A1628 100%)"><div class="fk-slide-inner"><div class="fk-top-bar"><button class="fk-chapter-list-btn" onclick="goToFkSlide(0)">'+chLabel(ch)+'</button><span class="fk-refcode">'+p.refcode+'</span></div><div class="fk-text" style="font-size:'+fs+'">'+p.text+'</div></div></div>';si++
        })
      })
    });
    total=si;chapterStart=cs;
    var c='<div class="ctrl-row"><button class="ctrl-btn" onclick="prevFkSlide()">&#x25C0;</button><button class="ctrl-btn" onclick="nextFkSlide()">&#x25B6;</button><div class="ctrl-progress" onclick="seekFkSlide(event)"><div class="ctrl-progress-fill" id="progFill"></div></div><div class="ctrl-label" id="ctrlLabel">01 / '+String(si).padStart(2,'0')+'</div><button class="ctrl-btn exit" onclick="closeFk()">&#x2716;</button></div>';
    slideShowEl.innerHTML='<button class="slide-close" onclick="closeFk()">&#x2716;</button><div class="slide-hint" id="slideHint">&#x2190; &#x2192; na swipe &#x2022; Esc: hivoaka</div>'+h+'<div class="slide-controls">'+c+'</div>';
    cur=0;updateCtrl();
    setTimeout(function(){var h2=document.getElementById('slideHint');if(h2)h2.classList.add('hide')},3000);
  }
  window.nextFkSlide=function(){if(cur<total-1)goToFkSlide(cur+1)};
  window.prevFkSlide=function(){if(cur>0)goToFkSlide(cur-1)};
  window.seekFkSlide=function(e){var r=e.currentTarget.getBoundingClientRect(),x=e.clientX-r.left,i=Math.round(x/r.width*(total-1));goToFkSlide(Math.max(0,Math.min(total-1,i)))};
  window.goToFkSlide=function(idx){
    if(idx===cur)return;
    var oe=document.getElementById('fkS'+cur),t='fade';
    if(oe){oe.classList.remove('active');oe.classList.add('exit','exit-'+t)}
    cur=idx;
    var ne=document.getElementById('fkS'+idx);
    if(ne){ne.classList.add('active','enter-'+t);setTimeout(function(){ne.classList.remove('enter-'+t)},800)}
    if(oe)setTimeout(function(){oe.classList.remove('exit','exit-'+t)},800);
    updateCtrl()
  };
  window.goToFkChapter=function(ci){var s=chapterStart[ci];if(s!==undefined)goToFkSlide(s)};
  function updateCtrl(){
    var f=document.getElementById('progFill'),l=document.getElementById('ctrlLabel');
    if(f)f.style.width=((cur+1)/total*100)+'%'
    if(l)l.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')
  }
  function closeFk(){
    try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
    slideShowEl.classList.remove('open');
    setTimeout(function(){if(slideShowEl){slideShowEl.remove();slideShowEl=null;location.href='index.html'}},500)
  }
  window.closeFk=closeFk;
  function resetHide(){
    if(!slideShowEl)return;
    var ctrl=slideShowEl.querySelector('.slide-controls'),cl=slideShowEl.querySelector('.slide-close'),h=document.getElementById('slideHint');
    if(ctrl)ctrl.style.opacity='1';if(cl)cl.style.opacity='1';
    if(h)h.classList.remove('hide');
    if(hideTimeout)clearTimeout(hideTimeout);
    hideTimeout=setTimeout(function(){if(!slideShowEl||!slideShowEl.classList.contains('open'))return;if(ctrl)ctrl.style.opacity='0';if(cl)cl.style.opacity='0'},2000);
    setTimeout(function(){if(h)h.classList.add('hide')},3000)
  }
  document.addEventListener('keydown',function(e){
    if(!slideShowEl||!slideShowEl.classList.contains('open'))return;
    var tag=e.target.tagName,inp=(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT');
    if(inp)return;
    if(e.key==='ArrowRight'){nextFkSlide();resetHide()}
    if(e.key==='ArrowLeft'){prevFkSlide();resetHide()}
    if(e.key==='Escape'){closeFk()}
  });
  document.addEventListener('mousemove',function(){if(!slideShowEl||!slideShowEl.classList.contains('open'))return;resetHide()});
  var tx=0,ty=0;
  document.addEventListener('touchstart',function(e){if(!slideShowEl||!slideShowEl.classList.contains('open'))return;tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY},{passive:true});
  document.addEventListener('touchend',function(e){
    if(!slideShowEl||!slideShowEl.classList.contains('open'))return;
    var dx=e.changedTouches[0].screenX-tx,dy=e.changedTouches[0].screenY-ty;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0){nextFkSlide()}else{prevFkSlide()}resetHide()}
  },{passive:true});
})();
</script>
<script>
// Autohide curseur après 2 secondes d'inactivité
(function(){var s=document.createElement('style');s.textContent='body.cursor-hide,body.cursor-hide *{cursor:none!important}';document.head.appendChild(s);var t=null;function h(){document.body.classList.remove('cursor-hide');if(t)clearTimeout(t);t=setTimeout(function(){document.body.classList.add('cursor-hide')},2000)}h();document.addEventListener('mousemove',h);document.addEventListener('touchstart',h)})();
</script>
<script defer src="hira-data.js?v=3"></script>
<script defer src="bible-data.js?v=3"></script>
<script defer src="bible-search-engine.js?v=3"></script>
<script defer src="search-bar.js?v=3"></script>
<script defer src="projector.js?v=7"></script>
<script src="alpine.min.js"></script>
<script src="voice-search.js"></script>
</body>
</html>
