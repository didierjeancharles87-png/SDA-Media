/* ═══ iOS 26 LIQUID GLASS — VARIABLES ═══ */
:root{
  --spring:.55s cubic-bezier(0.34,1.56,0.64,1);
  --spring-fast:.38s cubic-bezier(0.34,1.56,0.64,1);
  --spring-slow:.75s cubic-bezier(0.25,1.4,0.35,1);
  --ease-out:.4s cubic-bezier(0.22,1,0.36,1);
  --ease-in-out:.45s cubic-bezier(0.4,0,0.2,1);
  --glass-bg:rgba(255,255,255,0.08);
  --glass-border:rgba(255,255,255,0.18);
  --glass-blur:blur(28px) saturate(180%);
  --glass-blur-heavy:blur(48px) saturate(200%);
  --glass-shadow:0 8px 32px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.12);
  --glass-shadow-hover:0 20px 60px rgba(0,0,0,0.5),inset 0 1.5px 0 rgba(255,255,255,0.2);
  --blue:#0A84FF;
  --blue-light:#5AC8FA;
  --radius-pill:999px;
  --radius-card:22px;
  --radius-btn:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  background:#0A0F1E;color:rgba(255,255,255,0.97);
  min-height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  /* GPU layer for smooth compositing */
  transform:translateZ(0);
}
/* ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚ÂÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â SPLASH ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚ÂÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â */
.splash{
  position:fixed;inset:0;z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#0A0F1E 0%,#0D2140 50%,#0A1628 100%);
  transition:opacity .8s cubic-bezier(0.22,1,0.36,1),transform .8s cubic-bezier(0.22,1,0.36,1),filter .8s ease;
  will-change:opacity,transform,filter;
}
.splash.exit{opacity:0;transform:scale(1.08);filter:blur(8px) brightness(1.4);pointer-events:none}
.splash-logo{
  width:110px;height:110px;
  border-radius:28px;overflow:hidden;
  box-shadow:0 0 60px rgba(10,132,255,.5),0 0 120px rgba(10,132,255,.2),inset 0 1px 0 rgba(255,255,255,0.2);
  animation:logoPulse 2.4s cubic-bezier(0.4,0,0.6,1) infinite;margin-bottom:24px;
  backdrop-filter:var(--glass-blur);
  border:1px solid rgba(255,255,255,0.15);
}
.splash-logo img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes logoPulse{
  0%,100%{transform:scale(1) translateY(0);box-shadow:0 0 60px rgba(10,132,255,.5),0 0 120px rgba(10,132,255,.2),inset 0 1px 0 rgba(255,255,255,0.15)}
  50%{transform:scale(1.05) translateY(-4px);box-shadow:0 8px 80px rgba(10,132,255,.7),0 0 160px rgba(10,132,255,.35),inset 0 1px 0 rgba(255,255,255,0.25)}
}
.splash-typing{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:100px;margin-bottom:36px}
.splash-line{font-size:26px;font-weight:500;letter-spacing:1px;color:rgba(255,255,255,.7);height:34px;white-space:nowrap}
.splash-line.highlight{font-size:36px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#fff 0%,rgba(90,200,250,.9) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.splash-cursor{display:inline-block;font-weight:300;color:#5AC8FA;-webkit-text-fill-color:#5AC8FA;width:2px;animation:cursorBlink .6s step-end infinite}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
.splash-loader{width:200px;height:3px;background:rgba(255,255,255,.08);border-radius:var(--radius-pill);overflow:hidden;box-shadow:0 0 8px rgba(0,0,0,0.3)}
.splash-loader-bar{height:100%;background:linear-gradient(90deg,#0A84FF,#5AC8FA,#34C759);border-radius:var(--radius-pill);width:0%;transition:width .3s ease;box-shadow:0 0 10px rgba(10,132,255,0.6)}
.splash-skip{
  position:absolute;top:40px;right:24px;z-index:10;
  font-size:13px;font-weight:600;letter-spacing:1px;
  color:rgba(255,255,255,.6);cursor:pointer;
  padding:8px 18px;border-radius:var(--radius-pill);
  background:rgba(255,255,255,0.09);
  border:1px solid rgba(255,255,255,0.16);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 4px 16px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.1);
  transition:background var(--spring-fast),color var(--spring-fast),transform var(--spring-fast),box-shadow var(--spring-fast);
}
.splash-skip:hover{background:rgba(255,255,255,0.18);color:#fff;transform:scale(1.06);box-shadow:0 8px 24px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.2)}
.splash-skip:active{transform:scale(0.95)}
.splash-sig{position:absolute;bottom:40px;font-size:13px;color:#1A3A6B;font-weight:900;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 8px rgba(26,58,107,.9)}

/* ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚ÂÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â MAIN HOME ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚ÂÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â */
/* ═══ HOME — GEOMETRIC BLUE / BLACK / WHITE BACKGROUND ═══ */
body.home-active .bg-canvas{opacity:0}
.home-geo-bg{
  position:fixed;inset:0;z-index:0;opacity:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(135deg,#f4f6fa 0%,#e9ecf2 55%,#eef1f6 100%);
  transition:opacity .7s ease;
}
body.home-active .home-geo-bg{opacity:1}
.geo-shape{position:absolute;pointer-events:none}
.geo-shape.tl-black{top:-8%;left:-12%;width:52%;height:75%;background:#0b0f1c;clip-path:polygon(0 0,68% 0,26% 100%,0 100%)}
.geo-shape.tl-blue{top:-6%;left:-10%;width:34%;height:78%;background:linear-gradient(160deg,#1d3fc4,#0e2380);clip-path:polygon(0 0,42% 0,10% 100%,0 100%);opacity:.92}
.geo-shape.br-black{bottom:-10%;right:-12%;width:50%;height:70%;background:#0b0f1c;clip-path:polygon(100% 100%,32% 100%,74% 0,100% 0)}
.geo-shape.br-blue{bottom:-8%;right:-10%;width:32%;height:72%;background:linear-gradient(-20deg,#1d3fc4,#0e2380);clip-path:polygon(100% 100%,58% 100%,90% 0,100% 0);opacity:.92}
.geo-dots{position:absolute;width:120px;height:96px;background-image:radial-gradient(#1d3fc4 2.5px,transparent 2.5px);background-size:16px 16px;opacity:.55}
.geo-dots.dots-tr{top:8%;right:4%}
.geo-dots.dots-bl{bottom:9%;left:2%}

/* ═══ HOME — LAYOUT ═══ */
.main-home{
  position:relative;z-index:1;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;opacity:0;
  transition:opacity .8s cubic-bezier(0.22,1,0.36,1),transform .8s cubic-bezier(0.22,1,0.36,1);
  transform:translateY(20px) scale(0.98);
}
.main-home.visible{opacity:1;transform:translateY(0) scale(1)}
.main-home-title{text-align:center;margin-bottom:32px}
.main-home-title h1{
  font-size:44px;font-weight:900;letter-spacing:-1.5px;margin-bottom:10px;
  color:#0b0f1c;text-shadow:none;
}
.main-home-title p{
  font-size:14px;color:#1d3fc4;font-weight:700;letter-spacing:4px;text-transform:uppercase;text-shadow:none;
  display:inline-block;position:relative;padding-bottom:12px;
}
.main-home-title p::after{
  content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:44px;height:3px;border-radius:2px;background:linear-gradient(90deg,#1d3fc4,#5AC8FA);
}
.home-cards{
  display:grid;grid-template-columns:repeat(3,minmax(200px,260px));gap:22px;
  justify-content:center;max-width:900px;
}
.home-card{
  padding:26px 22px 24px;border-radius:18px;cursor:pointer;overflow:hidden;
  background:#ffffff;
  border:1px solid rgba(11,15,28,0.06);
  box-shadow:0 10px 30px rgba(15,25,60,.10),0 2px 8px rgba(15,25,60,.06);
  transition:transform var(--spring),box-shadow var(--ease-out);
  text-align:left;position:relative;will-change:transform;
  animation:cardIn .6s cubic-bezier(0.22,1,0.36,1) both;
}
.home-card::after{
  content:'';position:absolute;right:-2px;bottom:-2px;width:62%;height:52%;
  background:linear-gradient(135deg,#1d3fc4,#0e2380);
  clip-path:polygon(100% 100%,100% 0,0 100%);pointer-events:none;
}
.home-card.dark{background:#0b0f1c;border-color:rgba(255,255,255,0.06);box-shadow:0 10px 30px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25)}
.home-card .card-dots{
  position:absolute;top:16px;right:16px;width:30px;height:22px;
  background-image:radial-gradient(#1d3fc4 1.6px,transparent 1.6px);background-size:9px 9px;
  opacity:.5;z-index:1;
}
.home-card.dark .card-dots{background-image:radial-gradient(#5AC8FA 1.6px,transparent 1.6px);opacity:.5}
.home-card:nth-child(1){animation-delay:.08s}
.home-card:nth-child(2){animation-delay:.16s}
.home-card:nth-child(3){animation-delay:.24s}
.home-card:nth-child(4){animation-delay:.32s}
.home-card:nth-child(5){animation-delay:.40s}
.home-card:nth-child(6){animation-delay:.48s}
@keyframes cardIn{from{opacity:0;transform:translateY(36px) scale(.93)}to{opacity:1;transform:translateY(0) scale(1)}}
.home-card:hover{
  transform:translateY(-10px) scale(1.04);
  box-shadow:var(--glass-shadow-hover),0 0 32px var(--glow);
  background:rgba(255,255,255,0.12);
  border-color:rgba(255,255,255,0.22);
}
.home-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 44px rgba(15,25,60,.16),0 4px 14px rgba(15,25,60,.08)}
.home-card.dark:hover{box-shadow:0 20px 44px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.3)}
.home-card:active{transform:scale(.97);transition:transform .1s ease}
.home-card .card-border{display:none}
.hc-icon{
  width:52px;height:52px;font-size:24px;margin-bottom:16px;
  display:flex;align-items:center;justify-content:center;
  border-radius:13px;background:linear-gradient(135deg,#1d3fc4,#0e2380);
  box-shadow:0 6px 16px rgba(29,63,196,.35);
  filter:none;transition:transform var(--spring-fast);position:relative;z-index:1;
}
.home-card:hover .hc-icon{transform:scale(1.08) translateY(-2px)}
.hc-title{font-size:19px;font-weight:800;margin-bottom:6px;color:#0b0f1c;text-shadow:none;line-height:1.25;position:relative;z-index:1}
.home-card.dark .hc-title{color:#ffffff}
.hc-sub{font-size:13px;color:#5a6274;margin-bottom:16px;font-weight:500;line-height:1.4;position:relative;z-index:1}
.home-card.dark .hc-sub{color:rgba(255,255,255,.65)}
.hc-badge{
  display:inline-block;padding:5px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;
  background:#eef1f8;border:1px solid rgba(11,15,28,0.06);color:#1d3fc4;
  position:relative;z-index:1;
}
.home-card.dark .hc-badge{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14);color:#fff}
.home-sig{position:relative;margin-top:32px;font-size:12px;color:#5a6274;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.home-visit{position:relative;margin-top:8px;font-size:13px;color:#5a6274;font-weight:500;text-align:center;padding:0 24px;max-width:600px;line-height:1.5;letter-spacing:.3px}
/* Welcome screen */
.welcome{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
   background:#0A0F1E url('bgfirst.png') center/cover fixed;
  padding:40px 24px;
  transition:opacity .9s cubic-bezier(0.22,1,0.36,1),transform .9s cubic-bezier(0.22,1,0.36,1),filter .9s ease;
  will-change:opacity,transform;
}
.welcome::before{
  content:'';position:absolute;inset:0;pointer-events:none;

/* ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚ÂÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â SLIDESHOW ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚ÂÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â */
.slideshow{
  position:fixed;inset:0;z-index:2000;
  opacity:0;pointer-events:none;
  transition:opacity .5s ease;
}
.slideshow.open{opacity:1;pointer-events:all}

.slide{
  position:absolute;inset:0;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:0;padding:40px 24px;pointer-events:none;
}
.slide.active{z-index:2;opacity:1;pointer-events:all}
.slide.exit{z-index:3;pointer-events:none}
/* Enter transitions */
.slide.enter-fade{animation:fadeIn .6s ease both}
.slide.enter-zoomIn{animation:zoomIn .7s cubic-bezier(.22,1,.36,1) both}
.slide.enter-zoomOut{animation:zoomOut .7s cubic-bezier(.22,1,.36,1) both}
.slide.enter-slideLeft{animation:slideInRight .6s ease both}
.slide.enter-slideRight{animation:slideInLeft .6s ease both}
.slide.enter-blur{animation:blurIn .7s ease both}
.slide.enter-rotate{animation:rotateIn .8s cubic-bezier(.22,1,.36,1) both}
.slide.enter-flip{animation:flipIn .7s ease both}
/* Exit transitions */
.slide.exit-fade{animation:fadeOut .5s ease both}
.slide.exit-zoomIn{animation:fadeOut .4s ease both}
.slide.exit-zoomOut{animation:zoomOutBig .6s ease both}
.slide.exit-slideLeft{animation:slideOutLeft .5s ease both}
.slide.exit-slideRight{animation:slideOutRight .5s ease both}
.slide.exit-blur{animation:blurOut .5s ease both}
.slide.exit-rotate{animation:rotateOut .6s ease both}
.slide.exit-flip{animation:flipOut .5s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:scale(1)}}
@keyframes zoomOut{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes zoomOutBig{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.5)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOutLeft{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-120px)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOutRight{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(120px)}}
@keyframes blurIn{from{opacity:0;filter:blur(24px)}to{opacity:1;filter:blur(0)}}
@keyframes blurOut{from{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(24px)}}
@keyframes rotateIn{from{opacity:0;transform:rotate(-12deg) scale(.8)}to{opacity:1;transform:rotate(0) scale(1)}}
@keyframes rotateOut{from{opacity:1;transform:rotate(0) scale(1)}to{opacity:0;transform:rotate(12deg) scale(.8)}}
@keyframes flipIn{from{opacity:0;transform:perspective(800px) rotateY(90deg)}to{opacity:1;transform:rotateY(0)}}
@keyframes flipOut{from{opacity:1;transform:perspective(800px) rotateY(0)}to{opacity:0;transform:rotateY(-90deg)}}
@keyframes slideContentIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

  /* Psalms search engine */
  var psalmsSearchTimeout=null;
  window._psAll=[];window._psRes=[];window._psIdx=0;
  function normalizeText(t){return t.toLowerCase().replace(/[àáâãäåāăą]/g,'a').replace(/[èéêëēĕėę]/g,'e').replace(/[ìíîïīĭį]/g,'i').replace(/[òóôõöōŏő]/g,'o').replace(/[ùúûüūŭů]/g,'u').replace(/[ñńņňŉ]/g,'n').replace(/[çćĉċč]/g,'c').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
  function buildAllPsalms(){
    var book=window.SALAMO_DATA;if(!book)return;
    window._psAll=[];
    for(var ch in book.chapters){
      for(var v in book.chapters[ch]){
        window._psAll.push({chapter:parseInt(ch),verse:parseInt(v),text:book.chapters[ch][v]});
      }
    }
  }
  function findGlobalIdx(ch,v){
    for(var i=0;i<window._psAll.length;i++){
      var p=window._psAll[i];
      if(p.chapter===ch&&p.verse===v)return i;
    }
    return -1;
  }
  function searchPsalms(q){
    if(!q||!q.trim())return[];
    var nq=normalizeText(q);
    var words=nq.split(/\s+/).filter(function(w){return w.length>0});
    if(words.length===0)return[];
    var book=window.SALAMO_DATA;if(!book)return[];
    var res=[];
    try{
      for(var ch in book.chapters){
        for(var v in book.chapters[ch]){
          var text=book.chapters[ch][v];
          var nt=normalizeText(text);
          var exact=nt.indexOf(nq)>=0;
          var allWords=words.every(function(w){return nt.indexOf(w)>=0});
          if(exact||allWords){
            var score=exact?2:1;
            if(exact&&allWords)score=3;
            res.push({chapter:parseInt(ch),verse:parseInt(v),text:text,score:score});
          }
        }
      }
    }catch(e){}
    res.sort(function(a,b){return b.score-a.score});
    return res;
  }
  function doSearch(){
    var inp=document.getElementById('psalmsSearch');if(!inp)return;
    var q=inp.value;if(!q.trim()){document.getElementById('psalmsResults').innerHTML='<div class="psalms-empty">Soraty ny teny na andianteny hikarohana</div>';return}
